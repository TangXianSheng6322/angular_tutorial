<div class="container">
  <app-add-resolution-form
    (addResolution)="items.push($event)"
  ></app-add-resolution-form>

  <div class="row mt-3">
    <app-resolution-filter (filter)="filter = $event"></app-resolution-filter>
  </div>

  <div class="row mt-3">
    <app-resolution-list [resolutions]="visibleItems"></app-resolution-list>
  </div>
</div>
