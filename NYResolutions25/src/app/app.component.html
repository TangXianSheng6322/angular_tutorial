<div class="container">
  <app-add-resolution-form
    (addResolution)="items.push($event)"
  ></app-add-resolution-form>

  <div class="row mt-3">
    <app-resolution-filter [(filter)]="filter"></app-resolution-filter>
  </div>

  <div class="row mt-3">
    <app-resolution-list
      [resolutions]="items.filter(filter)"
    ></app-resolution-list>
  </div>
</div>
