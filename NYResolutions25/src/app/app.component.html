<div class="container">
  <form class="row mt-3 gx-3 gy-2 align-items-center justify-content-center">
    <div class="col-sm-6">
      <label for="specificSizeInputName" class="visually-hidden"
        >Resolution</label
      >
      <input
        type="text"
        name="new-resolution-text"
        class="form-control"
        [(ngModel)]="newResolutionText"
      />
    </div>
    <div class="col-auto">
      <button
        type="submit"
        class="btn btn-primary"
        (click)="$event.preventDefault(); addNewResolution()"
      >
        Add Resolution
      </button>
    </div>
  </form>

  <div class="row mt-3">
    <select class="form-select" [(ngModel)]="listFilter">
      <option value="0">All</option>
      <option value="1">Unfulfilled</option>
      <option value="2">Fulfilled</option>
    </select>
  </div>

  <div class="row mt-3">
    <app-resolution-list [resolutions]="visibleItems"></app-resolution-list>
  </div>
</div>
