<div *ngIf="resolutions.length === 0; else showItems">
  There are no items to display
</div>

<ng-template #showItems
  ><ul class="res-list">
    <resolution-list-item
      *ngFor="let resolution of resolutions"
      [ResolutionText]="resolution.ResolutionText"
      [(fulfilled)]="resolution.isComplete"
    ></resolution-list-item></ul
></ng-template>
