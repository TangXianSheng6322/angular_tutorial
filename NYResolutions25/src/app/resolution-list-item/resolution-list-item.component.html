<li class="d-flex justify-content-between">
  <div class="form-check">
    <label class="form-check-label" [ngClass]="cssClasses"
      ><input
        type="checkbox"
        class="checkbox idk"
        [checked]="fulfilled"
        (click)="toggleFulfilled()"
      />{{ ResolutionText }}</label
    >
  </div>
  <div>
    <button
      type="button"
      class="btn-close"
      (click)="removeResolution()"
    ></button>
  </div>
</li>
